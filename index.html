<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 🟢 Standard Meta (Fallbacks) -->
    <title>Biomart</title>
    <meta name="description" content="Your bio link, but it sells." />
    <meta name="theme-color" content="#0F7A4A" />
    
    <!-- 🟢 Open Graph Fallbacks (Used if a store has no banner) -->
    <meta property="og:title" content="Biomart - Your bio link, but it sells." />
    <meta property="og:description" content="Turn every click into a customer." />
    <meta property="og:image" content="https://biomart.pages.dev/og-fallback.jpg" />
    <meta property="og:type" content="website" />
    
    <!-- 🟢 Twitter Fallbacks -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Biomart - Your bio link, but it sells." />
    <meta name="twitter:description" content="Turn every click into a customer." />
    <meta name="twitter:image" content="https://biomart.pages.dev/og-fallback.jpg" />
    
    <!-- 🟢 Optimization: Preconnect to font and image servers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">

    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@600,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
